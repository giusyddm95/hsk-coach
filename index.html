<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: la pagina usa tutto lo schermo, i margini per notch e barra li gestisce il CSS -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HSK Coach</title>
  <meta name="description" content="App personale per studiare il cinese dall'HSK 1 all'HSK 7-9.">
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">

  <!-- Installazione sull'iPhone: nome sotto l'icona, schermo intero, icona -->
  <meta name="apple-mobile-web-app-title" content="HSK Coach">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Qui js/app.js disegna la schermata scelta nella barra in basso -->
  <main id="schermata" class="schermata"></main>

  <!-- Barra in basso. Le icone sono disegnate qui, senza librerie esterne. -->
  <nav class="barra" aria-label="Sezioni dell'app">
    <a href="#oggi" data-schermata="oggi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Oggi</span>
    </a>
    <a href="#studia" data-schermata="studia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="13" height="14" rx="2"/><path d="M4 7v11a3 3 0 0 0 3 3h10"/></svg>
      <span>Studia</span>
    </a>
    <a href="#dizionario" data-schermata="dizionario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3zM21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>
      <span>Dizionario</span>
    </a>
    <a href="#progressi" data-schermata="progressi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M6 17v-5M12 17V5M18 17V9"/></svg>
      <span>Progressi</span>
    </a>
    <a href="#impostazioni" data-schermata="impostazioni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span>Impostazioni</span>
    </a>
  </nav>

  <div id="avviso-aggiornamento" class="avviso" role="status" hidden>
    <span>Nuova versione disponibile</span>
    <button type="button" id="aggiorna" class="pulsante">Aggiorna</button>
  </div>
</body>
</html>
