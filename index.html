<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: la pagina usa tutto lo schermo, i margini per notch e barra li gestisce il CSS -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HSK Coach</title>
  <meta name="description" content="App personale per studiare il cinese dall'HSK 1 all'HSK 7-9.">
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">

  <!-- Installazione sull'iPhone: nome sotto l'icona, schermo intero, icona -->
  <meta name="apple-mobile-web-app-title" content="HSK Coach">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="home">
    <h1>HSK Coach</h1>
    <p class="nota">Qui arriverà la sessione di oggi.</p>
  </main>
  <footer class="piede">
    <p id="versione">Versione: in caricamento…</p>
    <button type="button" id="controlla-aggiornamenti" class="pulsante-testo">Controlla aggiornamenti</button>
    <p id="stato-aggiornamento" class="stato" aria-live="polite"></p>
  </footer>

  <div id="avviso-aggiornamento" class="avviso" role="status" hidden>
    <span>Nuova versione disponibile</span>
    <button type="button" id="aggiorna">Aggiorna</button>
  </div>
</body>
</html>
